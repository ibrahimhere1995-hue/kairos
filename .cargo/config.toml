# ts-rs: TypeScript types generated from Rust structs go to the frontend.
# Regenerate with `pnpm test:rust` (cargo test). Lives at the repo root so it applies
# whether cargo runs from here or from src-tauri/.
[env]
TS_RS_EXPORT_DIR = { value = "src/types", relative = true }
TS_RS_LARGE_INT = "number"
