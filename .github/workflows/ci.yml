name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Frontend — format, lint, typecheck, test
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test

      # tauri::generate_context! embeds the built frontend, so build it before compiling Rust.
      - name: Build frontend
        run: pnpm build

      - name: Rust — fmt, clippy, test
        run: |
          pnpm fmt:rust:check
          pnpm lint:rust
          pnpm test:rust
