[package]
name = "kairos"
version = "0.2.0"
description = "Kairos — the perfect moment to act. A local-first personal planner."
authors = ["Zack"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_migration = "2.6.0"
uuid = { version = "1.27.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.21"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2"
rrule = "0.14"
# .ics import (P2-T12, approved 2026-10-09). chrono-tz: same version rrule uses (one copy).
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
chrono-tz = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
keyring = "4.2.0"

[lints.clippy]
# PROJECT_RULES: no unwrap()/expect() outside tests and startup-fatal paths.
unwrap_used = "warn"
expect_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
ts-rs = "12"

# Desktop only: the Quick Capture shortcut (Ctrl/⌘+Shift+Space) from any app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.13.2"

# Not Windows: plain notifications (Windows uses tauri-winrt-notification for buttons).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"

# Windows only: reminder toasts with Done / Snooze / Open buttons (approved 2026-10-08).
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = ["Foundation", "Media_SpeechRecognition"] }
